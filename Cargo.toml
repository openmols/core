[workspace]
resolver = "3"
members = ["crates/molecule", "crates/render", "crates/project", "crates/llm", "crates/jobs", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/openmols/core"

[workspace.dependencies]
molecule = { path = "crates/molecule" }
render = { path = "crates/render" }
anyhow = "1"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
project = { path = "crates/project" }
llm = { path = "crates/llm" }
jobs = { path = "crates/jobs" }

# Full debug info for GPUI + wgpu overflows MSVC's PDB limits (LNK1318).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# xattr 0.2.3 (a dependency of GPUI) does not compile on Linux with current libc;
# see vendor/xattr/PATCHED.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
