name: Containers

# Builds the tool images from docker/<tool>/Dockerfile and publishes them to the
# GitHub Container Registry, so users pull them instead of building for minutes.
# The app asks for ghcr.io/openmols/<tool>:<IMAGE_VERSION> (see crates/jobs/src/lib.rs);
# bump IMAGE_VERSION here and the tags there together when a Dockerfile changes.
# FRODOCK is deliberately not built here: it cannot be redistributed.
on:
  push:
    branches: [main]
    paths:
      - "docker/pykvfinder/**"
      - "docker/autodock/**"
      - ".github/workflows/containers.yml"
  pull_request:
    paths:
      - "docker/pykvfinder/**"
      - "docker/autodock/**"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_VERSION: "1"

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [pykvfinder, autodock]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests (including from forks) only check that the image builds.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
